name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Android SDK
        run: test -d "$ANDROID_HOME" && echo "Android SDK available"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify application
        run: npm test
      - name: Check JavaScript syntax
        run: node --check www/app.js
      - name: Create Android project
        run: npx cap add android
      - name: Synchronize app
        run: npx cap sync android
      - name: Verify bundled web assets
        run: |
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/public/app.js
          test -s android/app/src/main/assets/public/style.css
          grep -q 'Mon Prof IA' android/app/src/main/assets/public/index.html
      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Verify APK signature and contents
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - name: Verify generated APK
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          echo "APK SHA-256:"
          sha256sum "$APK"
          echo "APK file format:"
          file "$APK"
          unzip -t "$APK" | tail -n 2
          echo "APK signing certificates:"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Build clean-install diagnostic APK
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          original='applicationId "dj.monprofia.troisieme"'
          replacement='applicationId "dj.monprofia.troisieme.cleaninstall"'
          if original not in s:
              raise SystemExit('Expected applicationId not found; cannot safely build diagnostic variant')
          p.write_text(s.replace(original,replacement,1))
          PY
          cd android
          bash ./gradlew assembleDebug --no-daemon
          mkdir -p ../diagnostic-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../diagnostic-apk/mon-prof-ia-installation-propre.apk
      - name: Verify clean-install APK
        run: |
          set -e
          APK=diagnostic-apk/mon-prof-ia-installation-propre.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | grep "package: name='dj.monprofia.troisieme.cleaninstall'"
          sha256sum "$APK"
      - name: Publish clean-install diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: mon-prof-ia-installation-propre
          path: diagnostic-apk/mon-prof-ia-installation-propre.apk
          if-no-files-found: error
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mon-prof-ia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
